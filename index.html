<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCF Portal Embed Tester</title>

  <!-- Google Fonts – Cinzel (Warcraft III style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- React CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser JSX -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Cinzel", serif;
      background: oklch(0.147 0.004 49.25);
      color: #fef3c7;
    }

    /* Warcraft-style button texture borders */
    .wc-btn-border {
      border-image: url("assets/button-bg-with-frame.webp") 16 fill / 5px;
    }
    .wc-card-border {
      border-image: url("assets/card-bg.webp") 24 fill / 24px;
    }
    .wc-input-border {
      border-image: url("assets/input-frame.webp") 16 fill / 6px;
    }

    /* Warcraft gold glow for focused inputs */
    .wc-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.4), 0 0 20px rgba(251, 191, 36, 0.15);
    }

    /* Warcraft button hover/active */
    .wc-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .wc-btn:active {
      filter: brightness(0.75);
      transform: scale(0.97);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
    }

    @keyframes scf-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scf-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes wc-shimmer {
      0%, 100% { background-position: -200% center; }
      50% { background-position: 200% center; }
    }
    @keyframes wc-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(251,191,36,0.2), 0 0 30px rgba(251,191,36,0.1); }
      50% { box-shadow: 0 0 25px rgba(251,191,36,0.4), 0 0 50px rgba(251,191,36,0.2); }
    }

    /* Noise overlay for textured feel */
    .page-bg::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("assets/noise.png");
      background-repeat: repeat;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── Environment configs ──
    const ENV_CONFIG = {
      "test.seeclickfix.com": {
        label: "TEST",
        embedUrl: "https://s3.amazonaws.com/cdn.seeclickfix.com/web_portal_test/embed.js",
        defaultToken: "CqTuizuRg28XaNXqMZszFRsp",
        bannerColor: "#8b4513",
        bannerBg: "#3d1c00",
      },
      "int.seeclickfix.com": {
        label: "INT",
        embedUrl: "https://s3.amazonaws.com/cdn.seeclickfix.com/web_portal_int/embed.js",
        defaultToken: "GHhYouRSWy3n6deLG6ZxXmAw",
        bannerColor: "#1a3a5c",
        bannerBg: "#0c1f33",
      },
      "qa02.seeclickfix.com": {
        label: "QA02",
        embedUrl: "https://s3.amazonaws.com/cdn.seeclickfix.com/web_portal_qa02/embed.js",
        defaultToken: "VjdVBhWq4tFwQ3TFq5zV1CR7",
        bannerColor: "#2d1a4e",
        bannerBg: "#1a0d2e",
      },
    };

    const DOMAINS = Object.keys(ENV_CONFIG);
    const DEFAULT_DOMAIN = "test.seeclickfix.com";

    // ── URL hash helpers ──
    function writeHash(domain, token) {
      window.location.hash = "domain=" + encodeURIComponent(domain) + "&token=" + encodeURIComponent(token);
    }
    function readHash() {
      const h = window.location.hash.slice(1);
      if (!h) return null;
      const params = new URLSearchParams(h);
      const domain = params.get("domain");
      const token = params.get("token");
      if (domain && token && ENV_CONFIG[domain]) return { domain, token };
      return null;
    }
    function clearHash() {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }

    // ── Cleanup helpers ──
    function cleanupEmbed() {
      // Remove any injected embed / marker scripts
      document.querySelectorAll("script[data-id='scf-fetch-portal3-embed-script']").forEach(s => s.remove());
      document.querySelectorAll("script[id^='scf-portal3-']").forEach(s => s.remove());
      // Remove any portal containers the embed may have created
      document.querySelectorAll("div[id^='scf-portal3-']").forEach(d => d.remove());
      // Clear SCF state
      if (window.SCF) {
        window.SCF.portalEmbeds = [];
      }
    }

    // ── Portal config fetcher (via CORS proxy in dev) ──
    const IS_DEV = ["localhost", "127.0.0.1"].includes(window.location.hostname)
      || window.location.hostname.endsWith(".github.io");

    async function fetchPortalConfig(domain, token) {
      const scfUrl = "https://" + domain + "/scf/v1/portal/configs/" + token;
      const url = IS_DEV
        ? "https://corsproxy.io/?" + encodeURIComponent(scfUrl)
        : scfUrl;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error("Config fetch failed: " + resp.status);
      return resp.json();
    }

    // ── ConfigForm component ──
    function ConfigForm({ onLoad }) {
      const [domain, setDomain] = useState(DEFAULT_DOMAIN);
      const [token, setToken] = useState(ENV_CONFIG[DEFAULT_DOMAIN].defaultToken);

      const handleDomainChange = (e) => {
        const newDomain = e.target.value;
        setDomain(newDomain);
        setToken(ENV_CONFIG[newDomain].defaultToken);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!token.trim()) return;
        onLoad(domain, token.trim());
      };

      return (
        <div style={styles.configWrapper} className="page-bg">
          <div style={styles.configCard}>
            <h1 style={styles.title}>SCF Portal Embed Tester</h1>
            <p style={styles.subtitle}>Select an environment and enter your token to load the portal embed widget.</p>

            <form onSubmit={handleSubmit}>
              <label style={styles.label}>Environment</label>
              <select value={domain} onChange={handleDomainChange} style={styles.select} className="wc-input">
                {DOMAINS.map(d => (
                  <option key={d} value={d}>
                    {ENV_CONFIG[d].label} — {d}
                  </option>
                ))}
              </select>

              <label style={styles.label}>Token</label>
              <input
                type="text"
                value={token}
                onChange={e => setToken(e.target.value)}
                placeholder="Paste your token here…"
                style={styles.input}
                className="wc-input"
                spellCheck={false}
              />

              <button
                type="submit"
                disabled={!token.trim()}
                className="wc-btn"
                style={{
                  ...styles.button,
                  opacity: token.trim() ? 1 : 0.5,
                  cursor: token.trim() ? "pointer" : "not-allowed",
                }}
              >
                ⚔ Load Embed
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ── ErrorBanner component ──
    function ErrorBanner({ message, onReset }) {
      return (
        <div style={styles.errorBanner}>
          <div style={styles.errorInner}>
            <span style={styles.errorIcon}>⛔</span>
            <div>
              <strong style={{ fontSize: "1.3rem" }}>Error: Token may not be valid</strong>
              <p style={{ margin: "6px 0 0", fontSize: "1rem" }}>{message}</p>
            </div>
          </div>
          <button onClick={onReset} style={styles.errorButton} className="wc-btn">← Go Back &amp; Try Again</button>
        </div>
      );
    }

    // ── EnvBanner component ──
    function EnvBanner({ domain, token, onReset, debugOpen }) {
      const cfg = ENV_CONFIG[domain];
      const handlePopout = () => {
        const url = window.location.origin + window.location.pathname + "#domain=" + encodeURIComponent(domain) + "&token=" + encodeURIComponent(token);
        window.open(url, "_blank");
      };
      return (
        <div style={{
          ...styles.envBanner,
          borderTopColor: "rgba(251,191,36,0.4)",
          color: "#fbbf24",
          right: debugOpen ? "400px" : "0",
          transition: "right 0.3s ease",
        }}>
          {onReset && (
            <button onClick={onReset} style={styles.bannerResetButton} className="wc-btn" title="Back to config">
              ← Reset
            </button>
          )}
          <span style={styles.envBannerText}>
            ⚔&nbsp; {cfg.label} EMBED SCRIPT TEST &nbsp;⚔&nbsp;&nbsp;|&nbsp;&nbsp;{domain}
          </span>
          <button onClick={handlePopout} style={styles.bannerPopoutButton} className="wc-btn" title="Open in new tab">
            ↗ Popout
          </button>
        </div>
      );
    }

    // ── LoadingOverlay component ──
    function LoadingOverlay({ domain }) {
      const cfg = ENV_CONFIG[domain];
      return (
        <div style={styles.loadingOverlay}>
          <div style={styles.loadingSpinner} />
          <p style={styles.loadingText}>Loading {cfg.label} embed…</p>
          <p style={styles.loadingSubtext}>{domain}</p>
        </div>
      );
    }

    // ── Debug panel helper components ──
    function Section({ title, children, defaultOpen = true }) {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div style={styles.debugSection}>
          <div style={styles.debugSectionHeader} onClick={() => setOpen(!open)}>
            <span style={{ transform: open ? "rotate(90deg)" : "rotate(0deg)", display: "inline-block", transition: "transform 0.15s" }}>▶</span>
            <span style={{ marginLeft: "8px" }}>{title}</span>
          </div>
          {open && <div style={styles.debugSectionBody}>{children}</div>}
        </div>
      );
    }

    function InfoRow({ label, value, mono }) {
      return (
        <div style={styles.debugInfoRow}>
          <span style={styles.debugInfoLabel}>{label}</span>
          <span style={{ ...styles.debugInfoValue, fontFamily: mono ? "'Courier New', monospace" : "inherit" }}>
            {value === undefined || value === null ? <em style={{ opacity: 0.4 }}>—</em> : String(value)}
          </span>
        </div>
      );
    }

    function FlagStatus({ flag, features }) {
      const present = Array.isArray(features) && features.includes(flag);
      return (
        <div style={{
          ...styles.debugFlagBanner,
          background: present ? "rgba(34,197,94,0.15)" : "rgba(239,68,68,0.15)",
          borderColor: present ? "rgba(34,197,94,0.4)" : "rgba(239,68,68,0.4)",
        }}>
          <span style={{ fontWeight: 700, color: present ? "#4ade80" : "#f87171" }}>
            {present ? "ENABLED" : "NOT PRESENT"}
          </span>
          <span style={{ marginLeft: "8px", fontFamily: "'Courier New', monospace", fontSize: "0.75rem", opacity: 0.8 }}>{flag}</span>
        </div>
      );
    }

    function DebugToggleButton({ isOpen, onClick }) {
      return (
        <button onClick={onClick} style={{
          ...styles.debugToggleBtn,
          right: isOpen ? "400px" : "0",
        }} title={isOpen ? "Close debug panel" : "Open debug panel"}>
          <span style={{ writingMode: "vertical-rl", textOrientation: "mixed", letterSpacing: "2px" }}>
            {isOpen ? "Close ✕" : "Debug ⚙"}
          </span>
        </button>
      );
    }

    function DebugPanel({ domain, token, portalConfig, configLoading, configError, onRefresh }) {
      const [userJson, setUserJson] = useState("");
      const [parsedUser, setParsedUser] = useState(null);
      const [userParseError, setUserParseError] = useState(null);

      const handlePasteUser = (e) => {
        const text = e.target.value;
        setUserJson(text);
        setUserParseError(null);
        setParsedUser(null);
        if (text.trim()) {
          try {
            setParsedUser(JSON.parse(text));
          } catch (err) {
            setUserParseError("Invalid JSON: " + err.message);
          }
        }
      };

      const handleCheckAuth = () => {
        window.open("https://" + domain + "/scf/v1/current_user", "_blank");
      };

      const cfg = ENV_CONFIG[domain];
      const org = portalConfig?.organization;
      const features = portalConfig?.features || [];
      const skus = portalConfig?.skus || [];

      return (
        <div style={styles.debugPanel}>
          <div style={styles.debugPanelHeader}>
            <span>Debug Panel</span>
            <button onClick={onRefresh} style={styles.debugRefreshBtn} className="wc-btn" disabled={configLoading}>
              {configLoading ? "…" : "↻ Refresh"}
            </button>
          </div>
          <div style={styles.debugPanelContent}>
            <Section title="Environment">
              <InfoRow label="Domain" value={domain} mono />
              <InfoRow label="Label" value={cfg?.label} />
              <InfoRow label="Token" value={token} mono />
            </Section>

            {configError && (
              <div style={styles.debugErrorMsg}>Config fetch error: {configError}</div>
            )}

            {configLoading && !portalConfig && (
              <div style={{ padding: "12px 16px", opacity: 0.5, fontSize: "0.8rem" }}>Loading config…</div>
            )}

            {portalConfig && (
              <>
                <Section title="Organization">
                  <InfoRow label="Name" value={org?.name} />
                  <InfoRow label="ID" value={org?.id} mono />
                  <InfoRow label="use_ai" value={org?.use_ai != null ? String(org.use_ai) : undefined} />
                  <InfoRow label="Guest submissions" value={portalConfig.allow_guest_submissions != null ? String(portalConfig.allow_guest_submissions) : undefined} />
                </Section>

                <Section title="Feature Flags">
                  <FlagStatus flag="tp_167319_direct_cp_auth" features={features} />
                  {features.length > 0 ? (
                    <div style={styles.debugFlagList}>
                      {features.map((f, i) => (
                        <div key={i} style={styles.debugFlagItem}>{f}</div>
                      ))}
                    </div>
                  ) : (
                    <div style={{ padding: "8px 0", opacity: 0.4, fontSize: "0.8rem" }}>No feature flags</div>
                  )}
                </Section>

                <Section title="SKUs" defaultOpen={false}>
                  {skus.length > 0 ? (
                    <div style={styles.debugFlagList}>
                      {skus.map((s, i) => (
                        <div key={i} style={styles.debugFlagItem}>{typeof s === "object" ? JSON.stringify(s) : s}</div>
                      ))}
                    </div>
                  ) : (
                    <div style={{ padding: "8px 0", opacity: 0.4, fontSize: "0.8rem" }}>No SKUs</div>
                  )}
                </Section>
              </>
            )}

            <Section title="Auth / User">
              <button onClick={handleCheckAuth} style={styles.debugAuthBtn} className="wc-btn">
                Check Auth ↗
              </button>
              <p style={{ margin: "8px 0 4px", fontSize: "0.7rem", opacity: 0.5 }}>
                Open the link above, then paste the JSON response below:
              </p>
              <textarea
                value={userJson}
                onChange={handlePasteUser}
                placeholder='Paste /scf/v1/current_user JSON here…'
                style={styles.debugTextarea}
                spellCheck={false}
              />
              {userParseError && (
                <div style={{ ...styles.debugErrorMsg, marginTop: "4px" }}>{userParseError}</div>
              )}
              {parsedUser && (
                <div style={{ marginTop: "8px" }}>
                  <InfoRow label="Login" value={parsedUser.login} />
                  <InfoRow label="Name" value={parsedUser.name} />
                  <InfoRow label="Email" value={parsedUser.email} />
                  <InfoRow label="Role" value={parsedUser.role} />
                  <InfoRow label="ID" value={parsedUser.id} mono />
                  <InfoRow label="Org ID" value={parsedUser.organization_id} mono />
                </div>
              )}
            </Section>
          </div>
        </div>
      );
    }

    // ── EmbedView component ──
    function EmbedView({ domain, token, onReset }) {
      const containerRef = useRef(null);
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(true);
      const [debugOpen, setDebugOpen] = useState(true);
      const [portalConfig, setPortalConfig] = useState(null);
      const [configLoading, setConfigLoading] = useState(false);
      const [configError, setConfigError] = useState(null);

      const loadPortalConfig = useCallback(() => {
        setConfigLoading(true);
        setConfigError(null);
        fetchPortalConfig(domain, token)
          .then(data => { setPortalConfig(data); setConfigLoading(false); })
          .catch(err => { setConfigError(err.message); setConfigLoading(false); });
      }, [domain, token]);

      useEffect(() => { loadPortalConfig(); }, [loadPortalConfig]);

      useEffect(() => {
        const cfg = ENV_CONFIG[domain];
        if (!cfg) {
          setError("Unknown domain: " + domain);
          return;
        }

        // Error listeners
        const handleError = (event) => {
          setError(event.message || "An unexpected error occurred while loading the embed.");
        };
        const handleRejection = (event) => {
          setError(event.reason?.message || event.reason || "An unhandled promise rejection occurred.");
        };
        window.addEventListener("error", handleError);
        window.addEventListener("unhandledrejection", handleRejection);

        // Replicate the exact original embed bootstrap pattern:
        // 1. A marker script with data-id sits in the DOM
        // 2. The embed <script> is inserted BEFORE the marker
        // 3. SCF.portalEmbeds is pushed with insertDomLocation = embed script id
        const container = containerRef.current;
        if (!container) return;

        const insertId = "scf-portal3-" + Date.now() + Math.random();

        // Marker script (mimics the original inline <script data-id=...>)
        const marker = document.createElement("script");
        marker.setAttribute("data-id", "scf-fetch-portal3-embed-script");
        container.appendChild(marker);

        // Embed script (inserted before the marker, just like the original)
        const embedScript = document.createElement("script");
        embedScript.type = "text/javascript";
        embedScript.async = true;
        embedScript.src = cfg.embedUrl;
        embedScript.id = insertId;
        embedScript.onerror = () => {
          setError("Failed to load the embed script. Check your network or the environment URL.");
        };
        marker.parentNode.insertBefore(embedScript, marker);

        // Push config
        window.SCF = window.SCF || {};
        window.SCF.portalEmbeds = window.SCF.portalEmbeds || [];
        window.SCF.portalEmbeds.push({
          insertDomLocation: insertId,
          token: token,
          width: "100%",
          height: "100%",
          startingPage: "exploreMap",
          requestTypeId: "",
          signin: "",
        });

        // Watch for the embed content to actually render.
        // The embed may use an iframe OR render directly into the DOM.
        // We poll for known SCF UI elements as a heuristic, plus check
        // for iframe load as a secondary signal.
        const CONTENT_SELECTORS = [
          ".scf-org-logo",
          ".config__top-toolbar-text",
          "[class*='toolbar']",
          "[class*='portal']",
          "[class*='explore']",
        ];

        const checkForContent = () => {
          // Check for SCF elements rendered directly in the container
          for (const sel of CONTENT_SELECTORS) {
            if (container.querySelector(sel)) return true;
          }
          // Check inside any iframe (same-origin only, fails silently for cross-origin)
          const iframes = container.querySelectorAll("iframe");
          for (const iframe of iframes) {
            try {
              const iframeDoc = iframe.contentDocument || iframe.contentWindow?.document;
              if (iframeDoc) {
                for (const sel of CONTENT_SELECTORS) {
                  if (iframeDoc.querySelector(sel)) return true;
                }
                // Heuristic: iframe body has substantial content (more than just a loader)
                if (iframeDoc.body && iframeDoc.body.children.length > 2) return true;
              }
            } catch (e) {
              // Cross-origin — can't inspect, fall through to other checks
            }
            // If iframe has fired its load event and has a src, treat as loaded
            if (iframe.src && iframe.getAttribute("data-loaded")) return true;
          }
          return false;
        };

        // Mark iframes as loaded when their load event fires
        const observer = new MutationObserver(() => {
          container.querySelectorAll("iframe").forEach(iframe => {
            if (!iframe.getAttribute("data-load-listener")) {
              iframe.setAttribute("data-load-listener", "true");
              iframe.addEventListener("load", () => {
                iframe.setAttribute("data-loaded", "true");
              });
            }
          });
        });
        observer.observe(container, { childList: true, subtree: true });

        // Poll every 300ms for content
        const pollInterval = setInterval(() => {
          if (checkForContent()) {
            setLoading(false);
            clearInterval(pollInterval);
            observer.disconnect();
          }
        }, 300);

        // Hard fallback: don't wait forever
        const fallbackTimer = setTimeout(() => {
          setLoading(false);
          clearInterval(pollInterval);
          observer.disconnect();
        }, 12000);

        return () => {
          observer.disconnect();
          clearInterval(pollInterval);
          clearTimeout(fallbackTimer);
          window.removeEventListener("error", handleError);
          window.removeEventListener("unhandledrejection", handleRejection);
          cleanupEmbed();
        };
      }, [domain, token]);

      const handleReset = () => {
        cleanupEmbed();
        onReset();
      };

      return (
        <div style={styles.embedWrapper}>
          {loading && !error && <LoadingOverlay domain={domain} />}
          {error && <ErrorBanner message={error} onReset={handleReset} />}
          <div ref={containerRef} style={{
            ...styles.embedContainer,
            width: debugOpen ? "calc(100% - 400px)" : "100%",
            transition: "width 0.3s ease",
          }} />
          <EnvBanner domain={domain} token={token} onReset={!error ? handleReset : undefined} debugOpen={debugOpen} />
          <DebugToggleButton isOpen={debugOpen} onClick={() => setDebugOpen(!debugOpen)} />
          {debugOpen && (
            <DebugPanel
              domain={domain}
              token={token}
              portalConfig={portalConfig}
              configLoading={configLoading}
              configError={configError}
              onRefresh={loadPortalConfig}
            />
          )}
        </div>
      );
    }

    // ── App component ──
    function App() {
      // Check URL hash on mount for persisted state
      const initial = readHash();
      const [view, setView] = useState(initial ? "embed" : "config");
      const [activeDomain, setActiveDomain] = useState(initial ? initial.domain : null);
      const [activeToken, setActiveToken] = useState(initial ? initial.token : null);

      const handleLoad = (domain, token) => {
        cleanupEmbed();
        writeHash(domain, token);
        setActiveDomain(domain);
        setActiveToken(token);
        setView("embed");
      };

      const handleReset = () => {
        cleanupEmbed();
        clearHash();
        setView("config");
        setActiveDomain(null);
        setActiveToken(null);
      };

      if (view === "embed" && activeDomain && activeToken) {
        return <EmbedView domain={activeDomain} token={activeToken} onReset={handleReset} />;
      }
      return <ConfigForm onLoad={handleLoad} />;
    }

    // ── Styles (Warcraft III theme) ──
    const WC_TEXTURES = {
      buttonBg: "assets/button-bg-with-frame.webp",
      buttonBgSm: "assets/button-bg-with-frame-sm.webp",
      cardBg: "assets/card-bg.webp",
      inputFrame: "assets/input-frame.webp",
    };

    const styles = {
      configWrapper: {
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        minHeight: "100vh",
        padding: "24px",
        background: `
          radial-gradient(closest-side at 50% 45%, rgba(255,210,120,0.08), rgba(0,0,0,0) 55%),
          radial-gradient(closest-side at 50% 50%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.75) 100%),
          url("assets/bg-texture.webp")
        `,
        backgroundSize: "cover",
        backgroundPosition: "center",
        backgroundRepeat: "no-repeat",
        position: "relative",
        overflow: "hidden",
